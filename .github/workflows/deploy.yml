name: Deploy to blog server

on:
  push:
    branches: [master]
  workflow_dispatch:

# 2022 年代项目（vue 3.2 reactivityTransform）：pnpm.overrides 钉住 vue 全家桶年代版本；
# pnpm 6 是 standalone 二进制（自带 node 运行时），不受 host node 版本影响
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 6.32.3

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # cypress 只是 e2e 壳，构建不需要其二进制（下载又大又慢）
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: 0

      - name: Build
        run: pnpm build

      - name: Package dist
        run: |
          test -f dist/index.html
          tar -C dist -czf demos-plum.tar.gz .

      - name: Upload to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: demos-plum.tar.gz
          target: /tmp/

      # 先在 /tmp 解压校验，再原子替换线上目录；plum.bak 留作人工回滚
      - name: Swap release
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: 22
          script: |
            set -e
            rm -rf /tmp/demos-plum-release
            mkdir -p /tmp/demos-plum-release
            tar xzf /tmp/demos-plum.tar.gz -C /tmp/demos-plum-release
            test -f /tmp/demos-plum-release/index.html
            mkdir -p /wwwroot/demos
            cd /wwwroot/demos
            rm -rf plum.bak
            [ ! -d plum ] || mv plum plum.bak
            mv /tmp/demos-plum-release plum
